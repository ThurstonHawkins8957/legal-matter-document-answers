[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-matter-document-answers"
version = "0.1.0"
description = "Answer matter questions and expose delivery or deadline follow-up decisions."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=1.50,<2",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
include = ["legal_matter_service.py", "legal_retrieval.py", "load_matter_documents.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
